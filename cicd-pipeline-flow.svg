<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="960" height="340" fill="#f8f9fa" rx="12"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1F3864">CI/CD Pipeline — GitHub Actions to Amazon EKS</text>
  <text x="480" y="50" text-anchor="middle" font-size="10" fill="#666">Zero-drift deployments with DevSecOps shift-left gates</text>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#378ADD"/>
    </marker>
  </defs>

  <!-- Stage boxes -->
  <!-- 1. Code -->
  <rect x="20" y="80" width="110" height="200" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5" rx="8"/>
  <text x="75" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#185FA5">1. Code</text>
  <rect x="32" y="108" width="86" height="36" fill="white" stroke="#378ADD" stroke-width="1" rx="4"/>
  <text x="75" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#185FA5">Developer</text>
  <text x="75" y="136" text-anchor="middle" font-size="9" fill="#555">Push to branch</text>
  <rect x="32" y="152" width="86" height="36" fill="white" stroke="#378ADD" stroke-width="1" rx="4"/>
  <text x="75" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#185FA5">Pre-commit</text>
  <text x="75" y="180" text-anchor="middle" font-size="9" fill="#555">Gitleaks · fmt</text>
  <rect x="32" y="196" width="86" height="36" fill="white" stroke="#378ADD" stroke-width="1" rx="4"/>
  <text x="75" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#185FA5">Pull Request</text>
  <text x="75" y="224" text-anchor="middle" font-size="9" fill="#555">Code review</text>

  <!-- Arrow -->
  <line x1="130" y1="180" x2="148" y2="180" stroke="#378ADD" stroke-width="2" marker-end="url(#a)"/>

  <!-- 2. CI -->
  <rect x="150" y="80" width="130" height="200" fill="#EAF3DE" stroke="#639922" stroke-width="1.5" rx="8"/>
  <text x="215" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#3B6D11">2. CI — Security</text>
  <rect x="162" y="108" width="106" height="30" fill="white" stroke="#639922" stroke-width="1" rx="4"/>
  <text x="215" y="127" text-anchor="middle" font-size="9" fill="#3B6D11">SAST (SonarQube)</text>
  <rect x="162" y="144" width="106" height="30" fill="white" stroke="#639922" stroke-width="1" rx="4"/>
  <text x="215" y="163" text-anchor="middle" font-size="9" fill="#3B6D11">SCA (Snyk)</text>
  <rect x="162" y="180" width="106" height="30" fill="white" stroke="#639922" stroke-width="1" rx="4"/>
  <text x="215" y="199" text-anchor="middle" font-size="9" fill="#3B6D11">Secrets (Gitleaks)</text>
  <rect x="162" y="216" width="106" height="30" fill="white" stroke="#639922" stroke-width="1" rx="4"/>
  <text x="215" y="235" text-anchor="middle" font-size="9" fill="#3B6D11">IaC Scan (Checkov)</text>

  <line x1="280" y1="180" x2="298" y2="180" stroke="#378ADD" stroke-width="2" marker-end="url(#a)"/>

  <!-- 3. Build -->
  <rect x="300" y="80" width="120" height="200" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" rx="8"/>
  <text x="360" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#854F0B">3. Build</text>
  <rect x="312" y="108" width="96" height="36" fill="white" stroke="#BA7517" stroke-width="1" rx="4"/>
  <text x="360" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#854F0B">Docker Build</text>
  <text x="360" y="136" text-anchor="middle" font-size="9" fill="#555">Multi-stage</text>
  <rect x="312" y="152" width="96" height="36" fill="white" stroke="#BA7517" stroke-width="1" rx="4"/>
  <text x="360" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#854F0B">Trivy Scan</text>
  <text x="360" y="180" text-anchor="middle" font-size="9" fill="#555">CVE: CRITICAL block</text>
  <rect x="312" y="196" width="96" height="36" fill="white" stroke="#BA7517" stroke-width="1" rx="4"/>
  <text x="360" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#854F0B">Push to ECR</text>
  <text x="360" y="224" text-anchor="middle" font-size="9" fill="#555">Tagged with SHA</text>

  <line x1="420" y1="180" x2="438" y2="180" stroke="#378ADD" stroke-width="2" marker-end="url(#a)"/>

  <!-- 4. Staging -->
  <rect x="440" y="80" width="130" height="200" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5" rx="8"/>
  <text x="505" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#0F6E56">4. Staging</text>
  <rect x="452" y="108" width="106" height="36" fill="white" stroke="#1D9E75" stroke-width="1" rx="4"/>
  <text x="505" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#0F6E56">ArgoCD Sync</text>
  <text x="505" y="136" text-anchor="middle" font-size="9" fill="#555">GitOps deploy</text>
  <rect x="452" y="152" width="106" height="36" fill="white" stroke="#1D9E75" stroke-width="1" rx="4"/>
  <text x="505" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#0F6E56">Integration Tests</text>
  <text x="505" y="180" text-anchor="middle" font-size="9" fill="#555">Smoke + E2E</text>
  <rect x="452" y="196" width="106" height="36" fill="white" stroke="#1D9E75" stroke-width="1" rx="4"/>
  <text x="505" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#0F6E56">DAST (ZAP)</text>
  <text x="505" y="224" text-anchor="middle" font-size="9" fill="#555">Runtime API scan</text>

  <line x1="570" y1="180" x2="588" y2="180" stroke="#378ADD" stroke-width="2" marker-end="url(#a)"/>

  <!-- 5. Approval -->
  <rect x="590" y="110" width="100" height="140" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5" rx="8"/>
  <text x="640" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">5. Gate</text>
  <rect x="602" y="138" width="76" height="36" fill="white" stroke="#7F77DD" stroke-width="1" rx="4"/>
  <text x="640" y="152" text-anchor="middle" font-size="9" font-weight="bold" fill="#3C3489">OPA Policy</text>
  <text x="640" y="166" text-anchor="middle" font-size="9" fill="#555">Compliance check</text>
  <rect x="602" y="182" width="76" height="36" fill="white" stroke="#7F77DD" stroke-width="1" rx="4"/>
  <text x="640" y="196" text-anchor="middle" font-size="9" font-weight="bold" fill="#3C3489">Approval</text>
  <text x="640" y="210" text-anchor="middle" font-size="9" fill="#555">Required for prod</text>

  <line x1="690" y1="180" x2="708" y2="180" stroke="#378ADD" stroke-width="2" marker-end="url(#a)"/>

  <!-- 6. Production -->
  <rect x="710" y="80" width="130" height="200" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5" rx="8"/>
  <text x="775" y="100" text-anchor="middle" font-size="11" font-weight="bold" fill="#A32D2D">6. Production</text>
  <rect x="722" y="108" width="106" height="36" fill="white" stroke="#E24B4A" stroke-width="1" rx="4"/>
  <text x="775" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#A32D2D">Blue/Green</text>
  <text x="775" y="136" text-anchor="middle" font-size="9" fill="#555">Zero-downtime</text>
  <rect x="722" y="152" width="106" height="36" fill="white" stroke="#E24B4A" stroke-width="1" rx="4"/>
  <text x="775" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#A32D2D">Health Check</text>
  <text x="775" y="180" text-anchor="middle" font-size="9" fill="#555">Auto-rollback on fail</text>
  <rect x="722" y="196" width="106" height="36" fill="white" stroke="#E24B4A" stroke-width="1" rx="4"/>
  <text x="775" y="210" text-anchor="middle" font-size="9" font-weight="bold" fill="#A32D2D">SLO Monitor</text>
  <text x="775" y="224" text-anchor="middle" font-size="9" fill="#555">Error budget alert</text>

  <!-- Metrics bar at bottom -->
  <rect x="20" y="295" width="920" height="32" fill="#1F3864" rx="6"/>
  <text x="160" y="314" text-anchor="middle" font-size="10" fill="white">⚡ Deployment Frequency: Daily</text>
  <text x="360" y="314" text-anchor="middle" font-size="10" fill="white">⏱ Lead Time: &lt; 30 min</text>
  <text x="560" y="314" text-anchor="middle" font-size="10" fill="white">🔄 Change Failure Rate: &lt; 2%</text>
  <text x="760" y="314" text-anchor="middle" font-size="10" fill="white">🏥 MTTR: &lt; 1 hour</text>
</svg>
